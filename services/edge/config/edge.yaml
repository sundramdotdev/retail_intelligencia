device:
  id: edge-dev-001
  name: Retail Edge Node 01

store:
  id: store_001
  name: Demo Superstore

camera:
  id: camera-01
  name: Camera 01
  type: usb
  # url can be provided here or overridden via CAMERA_STREAM_URL env var
  # url: "http://example.com/video"
  device_index: 0 # for usb

processing:
  target_fps: 10
  resize_width: 1280
  resize_height: 720
  display_enabled: false

monitoring:
  health_interval_seconds: 5
  fps_window_seconds: 5
  health:
    cpu_warning_percent: 80.0
    cpu_critical_percent: 95.0
    memory_warning_percent: 80.0
    memory_critical_percent: 95.0
    disk_warning_percent: 80.0
    disk_critical_percent: 90.0

logging:
  level: INFO

vision:
  enabled: true
  detector:
    type: yolo
    model: models/yolo11n.pt
    confidence_threshold: 0.40
    iou_threshold: 0.50
    device: auto
  classes:
    enabled:
      - person
      - bottle
      - cup
      - backpack
      - chair
      - laptop
      - cell phone
      - handbag
  tracking:
    enabled: true
    max_lost_frames: 30

# Entrance zone for footfall counting.
# This zone represents the store entrance/exit boundary.
# When a person's track transitions from OUTSIDE -> INSIDE this zone, footfall increments.
entrance_zone_id: zone-entrance

zones:
  - id: zone-entrance
    name: Entrance
    enabled: true
    polygon:
      - [0, 400]
      - [300, 400]
      - [300, 720]
      - [0, 720]
  - id: zone-aisle-01
    name: Aisle 1
    enabled: true
    polygon:
      - [100, 100]
      - [500, 100]
      - [500, 600]
      - [100, 600]
  - id: zone-aisle-02
    name: Aisle 2
    enabled: true
    polygon:
      - [500, 100]
      - [900, 100]
      - [900, 600]
      - [500, 600]
  - id: zone-checkout
    name: Checkout
    enabled: true
    polygon:
      - [900, 100]
      - [1280, 100]
      - [1280, 600]
      - [900, 600]

intelligence:
  enabled: true
  evaluation:
    interval_seconds: 1.0
    max_data_age_seconds: 2.0
  shelf:
    enabled: true
    zones:
      - id: zone-aisle-01
        name: Aisle 1 Shelf
        low_stock_threshold: 0.30
        empty_threshold: 0.10
        min_persistence_seconds: 3
        cooldown_seconds: 60
  queue:
    enabled: true
    zones:
      - id: zone-checkout
        high_threshold: 3
        recovery_threshold: 1
        min_persistence_seconds: 3
        cooldown_seconds: 60
  traffic:
    enabled: true
    zones:
      - id: zone-aisle-02
        window_seconds: 60
        high_threshold: 5
        low_threshold: 1
        recovery_high_threshold: 3
        recovery_low_threshold: 2
        min_persistence_seconds: 5
        cooldown_seconds: 60
  dwell:
    enabled: true
    zones:
      - id: zone-aisle-01
        min_duration_seconds: 10
        cooldown_seconds: 30
  inventory:
    enabled: true
    zones:
      - zone_id: shelf_demo
        object_class: bottle
        target_count: 5
        low_stock_threshold: 3
        recovery_threshold: 4
        min_persistence_seconds: 2.0
        cooldown_seconds: 10.0

mqtt:
  enabled: true
  host: localhost
  port: 1883
  tls: false
  username: null
  password: null
  environment: dev
  keepalive_seconds: 30
  reconnect:
    initial_delay_seconds: 1.0
    max_delay_seconds: 60.0

backend:
  enabled: true
  base_url: http://localhost:8000
  api_version: v1
  device_token: devkey_edge_001_secret
  timeout_seconds: 5.0
  heartbeat_interval_seconds: 15

offline_queue:
  db_path: data/event_queue.db
  max_events: 10000
  max_storage_mb: 100.0
  batch_size: 50
  drain_rate_limit: 50

# MJPEG stream server configuration.
# Serves a browser-compatible processed video stream with detection overlays.
# The dashboard connects to this to display the live camera view.
stream_server:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  quality: 75  # JPEG quality (1-100)
