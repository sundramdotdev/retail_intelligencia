device:
  id: edge-dev-001
  name: Retail Edge Node 01

camera:
  id: camera-01
  name: Camera 01
  type: network
  # url can be provided here or overridden via CAMERA_STREAM_URL env var
  # url: "http://example.com/video"
  device_index: 0 # for usb

processing:
  target_fps: 10
  resize_width: 1280
  resize_height: 720
  display_enabled: false

monitoring:
  health_interval_seconds: 5
  fps_window_seconds: 5
  health:
    cpu_warning_percent: 80.0
    cpu_critical_percent: 95.0
    memory_warning_percent: 80.0
    memory_critical_percent: 95.0
    disk_warning_percent: 80.0
    disk_critical_percent: 90.0

logging:
  level: INFO

vision:
  enabled: true
  detector:
    type: yolo
    model: models/yolo11n.pt
    confidence_threshold: 0.40
    iou_threshold: 0.50
    device: auto
  classes:
    enabled:
      - person
      - bottle
      - cup
      - backpack
  tracking:
    enabled: true
    max_lost_frames: 30

zones:
  - id: zone-aisle-01
    name: Aisle 1
    enabled: true
    polygon:
      - [100, 100]
      - [500, 100]
      - [500, 600]
      - [100, 600]
  - id: zone-aisle-02
    name: Aisle 2
    enabled: true
    polygon:
      - [500, 100]
      - [900, 100]
      - [900, 600]
      - [500, 600]
  - id: zone-checkout
    name: Checkout
    enabled: true
    polygon:
      - [900, 100]
      - [1280, 100]
      - [1280, 600]
      - [900, 600]
